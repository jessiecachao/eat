<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>干饭小队今天吃什么</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
      background: #fafbfc;
      color: #333;
      line-height: 1.6;
      min-height: 100vh;
    }

    /* 加载遮罩 */
    #loading {
      position: fixed; inset: 0; z-index: 999;
      background: #fff;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 12px;
    }
    #loading .spinner {
      width: 36px; height: 36px;
      border: 3px solid #ffd0b0;
      border-top-color: #ff6b35;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading p { color: #999; font-size: 14px; }

    /* 首页 */
    .home-page { padding: 20px 16px 80px; max-width: 900px; margin: 0 auto; }
    .page-header { text-align: center; padding: 28px 0 20px; }
    .page-header h1 { font-size: 26px; color: #ff6b35; margin-bottom: 6px; }
    .page-header p { font-size: 13px; color: #888; }

    /* 统计卡片 */
    .stats-bar { display: flex; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
    .stat-card {
      flex: 1; min-width: 90px;
      background: linear-gradient(135deg, #fff5ee, #fff);
      border: 1px solid #ffd0b0; border-radius: 12px;
      padding: 12px 8px; text-align: center;
    }
    .stat-card .num { font-size: 22px; font-weight: 800; color: #ff6b35; }
    .stat-card .label { font-size: 11px; color: #999; margin-top: 2px; }

    /* 筛选按钮 */
    .filter-bar { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
    .filter-btn {
      padding: 4px 12px; border-radius: 14px; font-size: 12px;
      border: 1.5px solid #ddd; background: #fff; color: #666;
      cursor: pointer; transition: all 0.2s;
    }
    .filter-btn:hover { border-color: #ff6b35; color: #ff6b35; }
    .filter-btn.active { background: #ff6b35; color: #fff; border-color: #ff6b35; }

    /* 表格 */
    .table-wrap { overflow-x: auto; border-radius: 12px; box-shadow: 0 2px 16px rgba(0,0,0,0.06); }
    .restaurant-table { width: 100%; border-collapse: collapse; background: #fff; font-size: 13px; min-width: 600px; }
    .restaurant-table thead th {
      background: linear-gradient(135deg, #ff6b35, #f7c948); color: #fff;
      padding: 12px 10px; text-align: center; font-weight: 600; white-space: nowrap;
    }
    .restaurant-table thead th:first-child { border-radius: 12px 0 0 0; }
    .restaurant-table thead th:last-child  { border-radius: 0 12px 0 0; }
    .restaurant-table tbody tr { border-bottom: 1px solid #f0f0f0; transition: background 0.15s; }
    .restaurant-table tbody tr:hover { background: #fff8f0; }
    .restaurant-table tbody td { padding: 10px 10px; text-align: center; vertical-align: middle; }
    .restaurant-table tbody td:nth-child(1) { color: #aaa; font-size: 12px; font-weight: 600; }
    .restaurant-table .name { font-weight: 600; color: #333; text-align: left !important; }
    .restaurant-table .cuisine { font-size: 12px; color: #888; text-align: left !important; }
    .restaurant-table .rating { color: #ff6b35; font-weight: 700; }
    .restaurant-table .price { color: #666; }
    .restaurant-table .location { font-size: 12px; color: #888; }
    .restaurant-table td:last-child { text-align: center; }
    .row-del-btn {
      padding: 3px 10px; font-size: 11px; color: #fff;
      background: linear-gradient(135deg, #ef5350, #e53935);
      border: none; border-radius: 6px; cursor: pointer; transition: all 0.2s;
    }
    .row-del-btn:hover { opacity: 0.8; transform: scale(1.05); }

    /* 添加区 */
    .add-section { margin-top: 28px; padding: 20px; background: linear-gradient(135deg, #f0faf0, #e8f5e9); border-radius: 16px; border: 1px solid #a5d6a7; }
    .add-section-title { font-size: 16px; font-weight: 700; color: #2e7d32; margin-bottom: 12px; text-align: center; }
    .add-form { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    .add-form input {
      padding: 8px 12px; border: 1.5px solid #c8e6c9; border-radius: 10px;
      font-size: 13px; outline: none; transition: border-color 0.2s;
      min-width: 0; flex: 1 1 140px; max-width: 200px;
    }
    .add-form input:focus { border-color: #66bb6a; }
    .add-form input::placeholder { color: #aaa; font-size: 12px; }
    .add-btn {
      padding: 8px 24px; font-size: 14px; font-weight: 700; color: #fff;
      background: linear-gradient(135deg, #66bb6a, #43a047);
      border: none; border-radius: 10px; cursor: pointer; transition: all 0.2s; white-space: nowrap;
    }
    .add-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(76,175,80,0.4); }
    .add-tip { font-size: 12px; color: #888; text-align: center; margin-top: 8px; }

    /* 转盘 */
    .wheel-section { display: flex; flex-direction: column; align-items: center; gap: 20px; margin-top: 32px; padding: 28px 16px; background: linear-gradient(135deg, #fff8f0, #fff); border-radius: 20px; border: 1px solid #ffd0b0; }
    .wheel-section-title { font-size: 20px; font-weight: 700; color: #ff6b35; }
    .wheel-wrapper { position: relative; width: min(340px, 85vw); height: min(340px, 85vw); }
    .wheel-canvas { width: 100%; height: 100%; border-radius: 50%; box-shadow: 0 0 0 8px #fff, 0 0 0 12px #f7c948, 0 4px 24px rgba(255,107,53,0.3); }
    .wheel-center {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 66px; height: 66px;
      background: linear-gradient(135deg, #ff6b35, #f7c948); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 12px rgba(255,107,53,0.4); z-index: 2;
    }
    .wheel-center span { color: #fff; font-weight: 800; font-size: 12px; text-align: center; line-height: 1.3; }
    .wheel-pointer { position: absolute; top: -6px; left: 50%; transform: translateX(-50%); z-index: 3; width: 0; height: 0; border-left: 10px solid transparent; border-right: 10px solid transparent; border-top: 24px solid #ff6b35; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2)); }
    .wheel-outer-ring { position: absolute; top: -4px; left: -4px; right: -4px; bottom: -4px; border-radius: 50%; border: 4px solid #fff; box-shadow: inset 0 0 0 4px #ffd0b0, 0 4px 20px rgba(255,107,53,0.2); pointer-events: none; }
    .spin-btn {
      padding: 13px 42px; font-size: 16px; font-weight: 700; color: #fff;
      background: linear-gradient(135deg, #ff6b35, #ff8c42);
      border: none; border-radius: 50px; cursor: pointer;
      box-shadow: 0 4px 16px rgba(255,107,53,0.4); transition: all 0.25s ease;
    }
    .spin-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(255,107,53,0.5); }
    .spin-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .result-card {
      background: linear-gradient(135deg, #fff5ee, #fff); border: 2px solid #ffd0b0;
      border-radius: 20px; padding: 24px 28px; text-align: center;
      max-width: 380px; width: 100%; box-shadow: 0 4px 20px rgba(255,107,53,0.1);
      animation: fadeInUp 0.5s ease;
    }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    .result-card .result-emoji { font-size: 36px; margin-bottom: 6px; }
    .result-card .result-label { font-size: 12px; color: #aaa; margin-bottom: 6px; }
    .result-card .result-name { font-size: 20px; font-weight: 800; color: #ff6b35; margin-bottom: 4px; }
    .result-card .result-cuisine { font-size: 13px; color: #888; margin-bottom: 6px; }
    .result-card .result-detail { font-size: 13px; color: #666; }
    .result-card .result-stars { color: #f7c948; font-size: 16px; margin: 4px 0; }
    .result-card .hidden { display: none; }
    .result-card .tip { font-size: 12px; color: #bbb; margin-top: 10px; }

    /* 底部 */
    .footer { background: linear-gradient(135deg, #ff6b35, #f7c948); color: rgba(255,255,255,0.9); padding: 24px 20px; text-align: center; font-size: 13px; line-height: 2; }
    .footer strong { color: #fff; }
    .footer .footer-brand { font-size: 15px; font-weight: 700; color: #fff; margin-bottom: 6px; }
    .footer .footer-divider { width: 40px; height: 3px; background: rgba(255,255,255,0.4); border-radius: 2px; margin: 10px auto; }

    /* ── 自定义删除确认弹窗 ── */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 1000;
      background: rgba(0,0,0,0.45);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .modal-overlay.active {
      opacity: 1; pointer-events: auto;
    }
    .modal-box {
      background: #fff; border-radius: 20px;
      padding: 32px 28px 24px;
      max-width: 360px; width: 90%;
      box-shadow: 0 12px 40px rgba(0,0,0,0.2);
      text-align: center;
      transform: scale(0.92); transition: transform 0.25s ease;
    }
    .modal-overlay.active .modal-box { transform: scale(1); }
    .modal-icon { font-size: 44px; margin-bottom: 10px; }
    .modal-title { font-size: 18px; font-weight: 700; color: #333; margin-bottom: 6px; }
    .modal-desc { font-size: 14px; color: #888; margin-bottom: 6px; line-height: 1.5; }
    .modal-name-highlight { color: #ff6b35; font-weight: 700; }
    .modal-actions { display: flex; gap: 10px; margin-top: 22px; justify-content: center; }
    .modal-btn {
      flex: 1; max-width: 130px; padding: 10px 0; font-size: 14px; font-weight: 700;
      border: none; border-radius: 12px; cursor: pointer; transition: all 0.2s;
    }
    .modal-btn-cancel { background: #f5f5f5; color: #666; }
    .modal-btn-cancel:hover { background: #eee; }
    .modal-btn-confirm {
      background: linear-gradient(135deg, #ef5350, #e53935); color: #fff;
      box-shadow: 0 3px 10px rgba(229,57,53,0.3);
    }
    .modal-btn-confirm:hover { transform: translateY(-1px); box-shadow: 0 5px 14px rgba(229,57,53,0.4); }
  </style>
</head>
<body>

  <!-- 加载遮罩 -->
  <div id="loading">
    <div class="spinner"></div>
    <p>正在连接数据库…</p>
  </div>

  <!-- 首页 -->
  <div class="home-page" id="homePage" style="display:none">
    <div class="page-header">
      <h1>干饭小队今天吃什么</h1>
      <p id="headerSubtitle">2026版 · 加载中… · 南山区桂湾三路</p>
    </div>

    <div class="stats-bar">
      <div class="stat-card"><div class="num" id="statTotal">—</div><div class="label">收录餐厅</div></div>
      <div class="stat-card"><div class="num" id="statCuisine">—</div><div class="label">菜系类型</div></div>
      <div class="stat-card"><div class="num" id="statMin">—</div><div class="label">最低人均</div></div>
      <div class="stat-card"><div class="num" id="statMax">—</div><div class="label">最高人均</div></div>
    </div>

    <div class="filter-bar" id="filterBar">
      <button class="filter-btn active" data-filter="all" onclick="filterTable('all')">全部</button>
      <button class="filter-btn" data-filter="西式" onclick="filterTable('西式')">🍔 西式快餐</button>
      <button class="filter-btn" data-filter="粉面" onclick="filterTable('粉面')">🍜 粉面米线</button>
      <button class="filter-btn" data-filter="牛肉" onclick="filterTable('牛肉')">🥩 潮汕牛肉</button>
      <button class="filter-btn" data-filter="客家" onclick="filterTable('客家')">🥢 客家风味</button>
      <button class="filter-btn" data-filter="粤式" onclick="filterTable('粤式')">🍲 粤式快餐</button>
      <button class="filter-btn" data-filter="湘川" onclick="filterTable('湘川')">🌶️ 湘菜川菜</button>
      <button class="filter-btn" data-filter="火锅" onclick="filterTable('火锅')">🍲 火锅烤鱼</button>
      <button class="filter-btn" data-filter="其他" onclick="filterTable('其他')">🍽️ 其他快餐</button>
    </div>

    <div class="table-wrap">
      <table class="restaurant-table" id="restaurantTable">
        <thead>
          <tr>
            <th>序号</th>
            <th>餐厅名称</th>
            <th>菜系</th>
            <th>评分</th>
            <th>人均</th>
            <th>位置</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>

    <div class="add-section">
      <div class="add-section-title">➕ 添加自定义餐厅</div>
      <div class="add-form">
        <input type="text" id="addName"     placeholder="餐厅名称" />
        <input type="text" id="addCuisine"  placeholder="菜系" />
        <input type="text" id="addRating"   placeholder="评分（如 4.2）" />
        <input type="text" id="addPrice"     placeholder="人均（如 20–35元）" />
        <input type="text" id="addLocation" placeholder="位置（如 广场内）" />
        <button type="button" class="add-btn" onclick="addRestaurant()">添加</button>
      </div>
      <div class="add-tip">添加后同步更新表格和转盘；点击每行"删除"可直接移除该餐厅 ✅</div>
    </div>

    <div class="wheel-section">
      <div class="wheel-section-title">🎲 今天吃什么？让命运帮你选</div>
      <div class="wheel-wrapper">
        <div class="wheel-outer-ring"></div>
        <canvas id="wheelCanvas" class="wheel-canvas" width="720" height="720"></canvas>
        <div class="wheel-pointer"></div>
        <div class="wheel-center"><span>今日<br>推荐</span></div>
      </div>
      <button class="spin-btn" id="spinBtn" onclick="spinWheel()">🎲 今天吃什么？点我旋转</button>
      <div class="result-card hidden" id="resultCard">
        <div class="result-emoji"   id="resultEmoji">🎉</div>
        <div class="result-label"   id="resultLabel">今天吃这个</div>
        <div class="result-name"   id="resultName"></div>
        <div class="result-cuisine" id="resultCuisine"></div>
        <div class="result-stars"  id="resultStars"></div>
        <div class="result-detail" id="resultDetail"></div>
        <div class="tip">👆 再点一次按钮可重新选择</div>
      </div>
    </div>
  </div>

  <!-- 删除确认弹窗 -->
  <div class="modal-overlay" id="deleteModal">
    <div class="modal-box">
      <div class="modal-icon">🗑️</div>
      <div class="modal-title">确认删除</div>
      <div class="modal-desc">确定要删除「<span class="modal-name-highlight" id="modalDeleteName"></span>」吗？</div>
      <div class="modal-desc" style="font-size:12px;color:#aaa;">删除后不可恢复</div>
      <div class="modal-actions">
        <button class="modal-btn modal-btn-cancel" id="modalCancelBtn">取消</button>
        <button class="modal-btn modal-btn-confirm" id="modalConfirmBtn">确认删除</button>
      </div>
    </div>
  </div>

  <footer class="footer">
    <div class="footer-brand">龙海家园广场周边餐厅指南（2026版）</div>
    <div class="footer-divider"></div>
    <div><strong>📍 地址：</strong>深圳市南山区桂湾三路龙海家园商业广场</div>
    <div><strong>🚇 地铁：</strong>1号线鲤鱼门站 A 口步行约 430 米</div>
  </footer>

<script>
const API = 'http://localhost:3000/api/restaurants';

// ── 全局数据 ───────────────────────────────────────────────
let restaurants = [];
let currentFilter = 'all';
let isSpinning = false;
let currentRotation = 0;

const wheelColors = [
  '#FF6B35','#F7C948','#6BCB77','#4D96FF','#FF6B9D','#C77DFF',
  '#FF9F43','#00D2D3','#EE5A24','#009432','#0652DD','#833471',
  '#FFA502','#2ED573','#7D5FFF','#FF4757','#70A1FF','#7BED9F',
  '#FF6348','#7CB342','#29B6F6','#AB47BC','#26A69A','#EF5350',
  '#FFCA28','#66BB6A','#42A5F5','#EC407A','#FF7043','#5C6BC0',
  '#26C6DA','#D4E157','#FF8A65','#8D6E63','#78909C','#EFEBE9',
  '#B71C1C','#E65100','#F57F17','#1B5E20','#0D47A1','#4A148C',
  '#880E4F','#B71C1C'
];

// ── 初始化：加载全部餐厅 ───────────────────────────────────
async function init() {
  try {
    const res  = await fetch(API);
    restaurants = await res.json();
    document.getElementById('loading').style.display = 'none';
    document.getElementById('homePage').style.display = 'block';
    updateStats();
    renderTable('all');
    drawWheel();
  } catch (err) {
    document.querySelector('#loading p').textContent = '❌ 数据库连接失败，请确保服务器已启动';
    console.error(err);
  }
}

// ── 表格渲染 ───────────────────────────────────────────────
function renderTable(filter) {
  const filtered = filter === 'all'
    ? restaurants
    : restaurants.filter(r => {
        if (filter === '西式') return r.cuisine.includes('西式');
        if (filter === '粉面') return r.cuisine.includes('粉面') || r.cuisine.includes('米线') || r.name.includes('螺蛳') || r.name.includes('面');
        if (filter === '牛肉') return r.cuisine.includes('牛肉') || r.name.includes('牛肉');
        if (filter === '客家') return r.cuisine.includes('客家');
        if (filter === '粤式') return r.cuisine.includes('粤式') || r.cuisine.includes('饺子') || r.cuisine.includes('云饺') || r.cuisine.includes('蒸饭') || r.cuisine.includes('汤粉');
        if (filter === '湘川') return r.cuisine.includes('湘菜') || r.cuisine.includes('川菜') || r.cuisine.includes('冒菜') || r.cuisine.includes('串串') || r.cuisine.includes('小面');
        if (filter === '火锅') return r.cuisine.includes('火锅') || r.cuisine.includes('烤鱼') || r.cuisine.includes('鱼');
        if (filter === '其他') return r.cuisine.includes('江西') || r.cuisine.includes('猪脚') || r.cuisine.includes('馄饨') || r.cuisine.includes('沙县') || r.cuisine.includes('自选') || r.cuisine.includes('快餐');
        return true;
      });

  document.getElementById('tableBody').innerHTML = filtered.map(r => `
    <tr>
      <td>${r.id}</td>
      <td class="name">${r.name}</td>
      <td class="cuisine">${r.cuisine}</td>
      <td class="rating">★ ${r.rating}</td>
      <td class="price">${r.price}</td>
      <td class="location">${r.location}</td>
      <td><button type="button" class="row-del-btn" data-id="${r.id}">删除</button></td>
    </tr>
  `).join('');
}

function filterTable(filter) {
  currentFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`.filter-btn[data-filter="${filter}"]`).classList.add('active');
  renderTable(filter);
}

// ── 添加餐厅 ───────────────────────────────────────────────
async function addRestaurant() {
  const name     = document.getElementById('addName').value.trim();
  const cuisine  = document.getElementById('addCuisine').value.trim();
  const rating   = parseFloat(document.getElementById('addRating').value.trim());
  const price    = document.getElementById('addPrice').value.trim();
  const location = document.getElementById('addLocation').value.trim();

  if (!name || !cuisine) { alert('请至少填写"餐厅名称"和"菜系"'); return; }

  try {
    const res  = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, cuisine, rating, price, location }),
    });
    if (!res.ok) throw new Error((await res.json()).error);
    const newR = await res.json();
    restaurants.push(newR);

    currentFilter = 'all';
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    document.querySelector('.filter-btn[data-filter="all"]').classList.add('active');
    renderTable('all');
    drawWheel();
    updateStats();

    document.getElementById('addName').value = '';
    document.getElementById('addCuisine').value = '';
    document.getElementById('addRating').value = '';
    document.getElementById('addPrice').value = '';
    document.getElementById('addLocation').value = '';
  } catch (err) {
    alert('添加失败：' + err.message);
  }
}

// ── 删除餐厅（自定义弹窗，修复 id 类型匹配）─────────────────
let pendingDeleteId = null;

function showDeleteModal(id) {
  // 统一转字符串比较，避免 API 返回字符串 id 导致 find 失败
  const r = restaurants.find(x => String(x.id) === String(id));
  if (!r) return;
  pendingDeleteId = id;
  document.getElementById('modalDeleteName').textContent = r.name;
  document.getElementById('deleteModal').classList.add('active');
}

function closeDeleteModal() {
  document.getElementById('deleteModal').classList.remove('active');
  pendingDeleteId = null;
}

async function confirmDelete() {
  const id = pendingDeleteId;
  closeDeleteModal();
  if (id === null) return;

  try {
    const res = await fetch(`${API}/${id}`, { method: 'DELETE' });
    if (!res.ok) throw new Error((await res.json()).error);
    restaurants = restaurants.filter(x => String(x.id) !== String(id));
    currentFilter = 'all';
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    document.querySelector('.filter-btn[data-filter="all"]').classList.add('active');
    renderTable('all');
    drawWheel();
    updateStats();
  } catch (err) {
    alert('删除失败：' + err.message);
  }
}

// ── 统计卡片 ───────────────────────────────────────────────
function updateStats() {
  const total = restaurants.length;
  const cuisines = [...new Set(restaurants.map(r => {
    if (r.cuisine.includes('西式')) return '西式';
    if (r.cuisine.includes('粉面') || r.cuisine.includes('米线') || r.name.includes('螺蛳') || r.name.includes('面')) return '粉面';
    if (r.cuisine.includes('牛肉') || r.name.includes('牛肉')) return '牛肉';
    if (r.cuisine.includes('客家')) return '客家';
    if (r.cuisine.includes('粤式') || r.cuisine.includes('饺子') || r.cuisine.includes('云饺') || r.cuisine.includes('蒸饭')) return '粤式';
    if (r.cuisine.includes('湘菜') || r.cuisine.includes('川菜') || r.cuisine.includes('冒菜') || r.cuisine.includes('串串')) return '湘川';
    if (r.cuisine.includes('火锅') || r.cuisine.includes('烤鱼') || r.cuisine.includes('鱼')) return '火锅';
    return '其他';
  }))].length;

  let minPrice = Infinity, maxPrice = 0;
  restaurants.forEach(r => {
    const m = r.price.match(/(\d+)/);
    if (m) {
      const v = parseInt(m[1]);
      if (v < minPrice) minPrice = v;
      if (v > maxPrice) maxPrice = v;
    }
  });

  document.getElementById('statTotal').textContent = total;
  document.getElementById('statCuisine').textContent = cuisines;
  document.getElementById('statMin').textContent  = minPrice === Infinity ? '—' : '¥' + minPrice;
  document.getElementById('statMax').textContent  = maxPrice === 0 ? '—' : '¥' + maxPrice;
  document.getElementById('headerSubtitle').textContent =
    `2026版 · 共 ${total} 家 · 南山区桂湾三路`;
}

// ── 转盘绘制 ───────────────────────────────────────────────
function drawWheel() {
  const canvas = document.getElementById('wheelCanvas');
  const ctx    = canvas.getContext('2d');
  const total  = restaurants.length;
  const arc    = total === 0 ? 0 : (2 * Math.PI) / total;
  const centerX = 360, centerY = 360;

  ctx.clearRect(0, 0, 720, 720);

  if (total === 0) {
    ctx.beginPath();
    ctx.arc(centerX, centerY, 340, 0, 2 * Math.PI);
    ctx.fillStyle = '#ddd';
    ctx.fill();
    ctx.fillStyle = '#888';
    ctx.font = 'bold 18px PingFang SC';
    ctx.textAlign = 'center';
    ctx.fillText('暂无餐厅', centerX, centerY + 6);
    return;
  }

  restaurants.forEach((r, i) => {
    const startAngle = i * arc - arc / 2;
    const endAngle   = startAngle + arc;
    ctx.beginPath();
    ctx.moveTo(centerX, centerY);
    ctx.arc(centerX, centerY, 340, startAngle, endAngle);
    ctx.closePath();
    ctx.fillStyle   = wheelColors[i % wheelColors.length];
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth   = 2;
    ctx.stroke();

    ctx.save();
    ctx.translate(centerX, centerY);
    ctx.rotate(startAngle + arc / 2);
    ctx.textAlign   = 'right';
    ctx.fillStyle   = '#fff';
    const fontSize  = total > 36 ? 11 : 13;
    ctx.font        = `bold ${fontSize}px "PingFang SC", "Microsoft YaHei", sans-serif`;
    let shortName   = r.name;
    if (shortName.length > 5) shortName = shortName.substring(0, 4) + '…';
    ctx.shadowColor = 'rgba(0,0,0,0.3)';
    ctx.shadowBlur  = 3;
    ctx.fillText(shortName, 318, 5);
    ctx.restore();
  });

  ctx.beginPath();
  ctx.arc(centerX, centerY, 56, 0, 2 * Math.PI);
  ctx.fillStyle   = '#fff';
  ctx.fill();
  ctx.strokeStyle = '#f7c948';
  ctx.lineWidth   = 4;
  ctx.stroke();
}

// ── 转盘旋转 ───────────────────────────────────────────────
function spinWheel() {
  if (isSpinning || restaurants.length === 0) return;
  isSpinning = true;
  const btn       = document.getElementById('spinBtn');
  const resultCard = document.getElementById('resultCard');
  btn.disabled    = true;
  btn.textContent = '🎡 旋转中…';
  resultCard.classList.add('hidden');

  const randomIndex = Math.floor(Math.random() * restaurants.length);
  const arc         = (2 * Math.PI) / restaurants.length;
  const targetAngle = -Math.PI / 2 - (randomIndex + 0.5) * arc;
  const extraSpins  = (5 + Math.floor(Math.random() * 4)) * 2 * Math.PI;
  const targetRotation = currentRotation + extraSpins + (2 * Math.PI * 10 - targetAngle) - (currentRotation % (2 * Math.PI));

  const canvas    = document.getElementById('wheelCanvas');
  const startTime  = performance.now();
  const duration  = 4000;
  const startRotation = currentRotation;

  function animate(now) {
    const elapsed  = now - startTime;
    const progress = Math.min(elapsed / duration, 1);
    const eased    = 1 - Math.pow(1 - progress, 3);
    const rotation = startRotation + (targetRotation - startRotation) * eased;
    canvas.style.transform = `rotate(${rotation}rad)`;
    currentRotation = rotation;
    if (progress < 1) {
      requestAnimationFrame(animate);
    } else {
      isSpinning = false;
      btn.disabled    = false;
      btn.textContent = '🎲 今天吃什么？点我旋转';
      showResult(restaurants[randomIndex]);
    }
  }
  requestAnimationFrame(animate);
}

// ── 显示结果 ───────────────────────────────────────────────
function showResult(r) {
  const resultCard = document.getElementById('resultCard');
  resultCard.classList.remove('hidden');
  document.getElementById('resultEmoji').textContent  = '🎉';
  document.getElementById('resultName').textContent   = r.name;
  document.getElementById('resultCuisine').textContent = r.cuisine;
  document.getElementById('resultStars').textContent  = '★'.repeat(Math.round(r.rating)) + '☆'.repeat(5 - Math.round(r.rating));
  document.getElementById('resultDetail').textContent = `📍 ${r.location}　💰 ${r.price}`;
  resultCard.style.animation = 'none';
  resultCard.offsetHeight;
  resultCard.style.animation = 'fadeInUp 0.5s ease';
}

// ── 事件委托（删除按钮）────────────────────────────────────
document.getElementById('tableBody').addEventListener('click', function(e) {
  const btn = e.target.closest('.row-del-btn');
  if (!btn) return;
  showDeleteModal(btn.getAttribute('data-id'));
});

// ── 模态弹窗按钮事件 ───────────────────────────────────────
document.getElementById('modalCancelBtn').addEventListener('click', closeDeleteModal);
document.getElementById('modalConfirmBtn').addEventListener('click', confirmDelete);
// 点击遮罩层关闭弹窗
document.getElementById('deleteModal').addEventListener('click', function(e) {
  if (e.target === this) closeDeleteModal();
});

// ── 启动 ──────────────────────────────────────────────────
init();
</script>
